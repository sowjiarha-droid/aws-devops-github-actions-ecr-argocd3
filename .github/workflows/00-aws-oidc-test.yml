name: AWS OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-authentication:
    name: Test AWS Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Inspect OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const tokenAuth = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            const response = await fetch(tokenUrl + '&audience=sts.amazonaws.com', {
              headers: {
                Authorization: `Bearer ${tokenAuth}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const data = await response.json();
            const payload = JSON.parse(
              Buffer.from(data.value.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Ref:", payload.ref);

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
