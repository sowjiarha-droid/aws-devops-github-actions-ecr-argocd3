
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ui
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sowjiarha-droid/aws-devops-github-actions-ecr-argocd3.git
    targetRevision: main
    path: src/ui/chart

    helm:
      releaseName: ui
      valueFiles:
        - values-ui.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ui

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

